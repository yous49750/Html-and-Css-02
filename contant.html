<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>যোগাযোগ করুন | Contact Us</title>
    <style>
        /* রিসেট এবং মৌলিক স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* কন্টেইনার লেআউট */
        .contact-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 900px;
            display: flex;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* বাম পাশের কন্টাক্ট ইনফো স্টাইল */
        .contact-info {
            background-color: #008080;
            color: #ffffff;
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-info h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .contact-info p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e0f2f1;
        }

        .info-item {
            margin-bottom: 20px;
        }

        .info-item strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .info-item p {
            margin-bottom: 0;
        }

        /* ডান পাশের ফর্ম স্টাইল */
        .contact-form {
            padding: 40px;
            flex: 1.5;
        }

        .contact-form h2 {
            font-size: 24px;
            color: #333333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #555555;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #008080;
        }

        .form-group textarea {
            resize: vertical;
        }

        /* সাবমিট বাটন */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #008080;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #005656;
        }

        /* মোবাইল ও ছোট ডিভাইসের জন্য রেসপন্সিভ ডিজাইন */
        @media (max-width: 768px) {
            .contact-container {
                flex-direction: column;
            }

            .contact-info,
            .contact-form {
                padding: 25px;
            }
        }
    </style>


</head>

<body>

    <div class="contact-container">
        <!-- বাম পাশের সেকশন: যোগাযোগের তথ্য -->
        <div class="contact-info">
            <h2>যোগাযোগের বিবরণ</h2>
            <p>আপনার যেকোনো প্রশ্ন বা মতামতের জন্য আমাদের সাথে যোগাযোগ করতে পারেন।</p>

            <div class="info-item">
                <strong>ঠিকানা:</strong>
                <p>ধানমন্ডি, ঢাকা - ১২০৯, বাংলাদেশ</p>
            </div>

            <div class="info-item">
                <strong>ইমেইল:</strong>
                <p>info@example.com</p>
            </div>

            <div class="info-item">
                <strong>ফোন:</strong>
                <p>+৮৮০ ১৭০০-০০০০০</p>
            </div>
        </div>

        <!-- ডান পাশের সেকশন: কন্টাক্ট ফর্ম -->
        <div class="contact-form">
            <h2>আমাদের মেসেজ পাঠান</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">আপনার নাম</label>
                    <input type="text" id="name" name="name" placeholder="আপনার পূর্ণ নাম লিখুন" required>
                </div>

                <div class="form-group">
                    <label for="email">ইমেইল ঠিকানা</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">বিষয়</label>
                    <input type="text" id="subject" name="subject" placeholder="মেসেজের বিষয়" required>
                </div>

                <div class="form-group">
                    <label for="message">মেসেজ</label>
                    <textarea id="message" name="message" rows="5" placeholder="আপনার বার্তাটি বিস্তারিত লিখুন..."
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">পাঠিয়ে দিন</button>
            </form>
        </div>
    </div>

</body>

</html>
